server:
  port: 8080



  

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
  
  data:
    redis:
      url: ${REDIS_URL}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 24 hours in milliseconds

resend:
  api-key: ${RESEND_API_KEY}

groq:
  api-key: ${GROQ_API_KEY}